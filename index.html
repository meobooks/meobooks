const ntSnd=(()=>{
  let ctx=null;
  const beep=(f,d,type,vol,delay)=>{
    try{
      if(localStorage.getItem("bt_snd")==="0")return;
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==="suspended")ctx.resume();
      const t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();
      o.type=type||"sine";o.frequency.value=f;
      g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d);
    }catch(e){}
  };
  return{
    tap:()=>beep(560,.06,"triangle",.04),
    ok:()=>{beep(660,.1,"sine",.06);beep(880,.14,"sine",.06,.09)},
    bad:()=>{beep(200,.16,"sawtooth",.035);beep(150,.2,"sawtooth",.035,.1)},
    batch:()=>{beep(660,.1,"sine",.06);beep(880,.1,"sine",.06,.1);beep(1175,.18,"sine",.06,.2)},
    end:()=>{beep(784,.14,"triangle",.07);beep(988,.14,"triangle",.07,.14);beep(1319,.3,"triangle",.07,.28)}
  };
})();

function NoiTu({jl,theme:a,notebooks:nbs=[],nbViews={},stats:vs={},onXp=()=>{},toast=()=>{}}){

  const[sec,setSec]=useState(0),[res,setRes]=useState(null);

  /* thời gian chơi (đếm lên) */
  useEffect(()=>{

  /* danh sách từ dùng được: có nghĩa tiếng Việt, bỏ trùng nghĩa / trùng mặt chữ để không bị nhập nhằng khi nối */
  const all=useMemo(()=>{
    if(!jl.ready)return[];
    const seenM=new Set(),seenF=new Set(),out=[];

  if(!jl.ready)return E(JLoading,{theme:a});

  /* ---------- bộ thẻ: tất cả / từng sổ / từng view / từ hay sai ---------- */

  const un=all.filter(x=>!known.has(nbOf(x.v)));

  const pick=(side,k)=>{

  /* ---------- MÀN HƯỚNG DẪN / CHỌN BỘ THẺ ---------- */

const strip4=s=>String(s||"").toLowerCase().replace(/[\s\u3000、。，．,.!！?？・"'“”「」『』]/g,"");
const headOf4=s=>String(s||"").split(/[,，、.。(（\[【]/)[0];
const editDist4=(a,b)=>{const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]};
const tol4=x=>x.length<=3?0:x.length<=6?1:2;
const lenientOk=(typed,accepts)=>{
  const t=strip4(typed);if(!t)return false;
  return accepts.some(c=>[strip4(c),strip4(headOf4(c))].some(x=>x&&editDist4(t,x)<=tol4(x)));
};
const exactOk=(typed,accepts)=>accepts.some(c=>norm(c)===norm(typed));

function JlptStudy({jl:o,theme:a,notebooks:nbs=[],nbViews={},onSaveNbViews=()=>{},reviewDone:rdDay="",onReviewDone:setRd=()=>{},stats:vs={},onXp=()=>{}}){
  const E=React.createElement,KEY="mochi_smart_session_v2";

  const[sess,setSess]=useState(loadSess),[inS,setInS]=useState(false),[src,setSrc]=useState("due"),[sum,setSum]=useState(null);

  const kref=useRef({on:false}),inpRef=useRef(null),qCache=useRef({key:"",N:null}),[,setTick]=useState(0);

  /* Nghỉ ngắn (REST_MS) sau mỗi câu trả lời, không hiển thị trên giao diện */
  const REST_MS=500;
  const restLeft=ss=>ss&&ss.answeredAt?Math.max(0,REST_MS-(Date.now()-ss.answeredAt)):0;
  useEffect(()=>{
    if(!sess||!sess.answeredAt)return;

  const cd=v=>{const d=new Date(v.created_at||0);return isNaN(d)?"":dayKey(d)};
  const known=new Set(nbs.map(n=>n.id));

  const allWords=o.vocab.slice().sort(byNewest);

  /*
   * THUẬT TOÁN HỌC BÀI THÔNG MINH & NGẮT QUÃNG:
   * - Lần 1 (attempt = 1): 5 bước đầy đủ:
   *   ["jp_to_vi", "vi_to_jp", "type_reading", "type_meaning", "type_word"]
   * - Nếu sai bất kỳ bước nào trong 5 bước -> đánh dấu failedThisRound = true.
   * - Sau khi đi hết các vòng của tất cả từ vựng trong đợt hiện tại, các từ bị sai sẽ quay lại học lại từ đầu ở đợt kế tiếp (attempt = 2):
   *   Bắt đầu lại từ 5 bước: ["jp_to_vi", "vi_to_jp", "type_reading", "type_meaning", "type_word"].
   *   Theo dõi riêng 3 bài kiểm tra tự luận (testAllCorrect).
   * - Nếu ở lần 2 (attempt >= 2), học viên điền đúng cả 3 bài kiểm tra tự luận (hoặc vừa hoàn tất 3 bài kiểm tra đúng mà trước đó ở lần 2 đã trắc nghiệm đúng), chỉ cần thêm 1 lần chọn Nhật -> Việt và 1 lần Việt -> Nhật ("reinforce_mc") nữa là hoàn thành!
   */
  const FULL_STEPS=["jp_to_vi","vi_to_jp","type_reading","type_meaning","type_word"];
  const REINFORCE_STEPS=["jp_to_vi","vi_to_jp"];

  const makeInitialQueue=(words,maxCount=12)=>{
    const prioritized=words.map(v=>({v,k:Math.random()/({tough:3,learn:1.5,known:.6}[classOf(vs,v,o.srs)])})).sort((x,y)=>x.k-y.k).map(x=>x.v).slice(0,maxCount);
    return prioritized.map(w=>({
      vocabId:w.id,
      attempt:1,
      stage:"full", // "full" (5 bước) hoặc "reinforce" (2 bước củng cố sau lần 2 điền đúng)
      steps:[...FULL_STEPS],
      si:0,
      failedThisPass:false,
      testsPassedInAttempt2:0

  const guard=()=>{if(sess)o.toast("Đã thay buổi học dở bằng buổi mới");return true};

  const shuffleArr=arr=>{const r=arr.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};

  /* Trộn câu hỏi: mỗi lượt gồm `size` từ, mọi câu hỏi của các từ đó được xáo lẫn vào nhau,
     nhưng với từng từ vẫn giữ đúng thứ tự bước (chọn đáp án trước, điền sau). */
  const buildPlan=(queue,size)=>{
    const plan=[];
    for(let b=0;b<queue.length;b+=size){
      const bag=[];
      for(let i=b;i<Math.min(b+size,queue.length);i++){

  };

     xong nhóm nào tự chuyển sang 5 từ kế tiếp trong view/sổ đang học. */
  const startSkim=(title,words,viewRef=null)=>{
    if(!guard())return;
    if(!words.length)return o.toast("Không có từ vựng nào để lướt!");

  const viewProgress=view=>{

    const updatedItem={
      ...curItem,
      failedThisPass:curItem.failedThisPass||!isCorrect,

            steps:[...REINFORCE_STEPS],
            si:0,
            failedThisPass:false,
            testsPassedInAttempt2:3
          });

          // Sai ít nhất 1 lần bất kỳ -> quay lại học lại từ đầu từ vựng đó (1 Nhật->Việt, 1 Việt->Nhật, 3 bài kiểm tra)

            vocabId:curItem.vocabId,
            attempt:curItem.attempt+1,
            stage:"full",
            steps:[...FULL_STEPS],
            si:0,
            failedThisPass:false,
            testsPassedInAttempt2:0
          });
        }
      }else if(curItem.stage==="skim"){
        if(curItem.failedThisPass){
          // Lướt: từ nào chọn sai sẽ được hỏi lại ở vòng cuối (2 câu Nhật↔Việt)

        }
      }else if(curItem.stage==="reinforce"){
        if(curItem.failedThisPass){
          // Nếu ở vòng củng cố Nhật->Việt / Việt->Nhật vẫn sai -> quay lại từ đầu 5 bước

            vocabId:curItem.vocabId,
            attempt:curItem.attempt+1,
            stage:"full",
            steps:[...FULL_STEPS],
            si:0,
            failedThisPass:false,
            testsPassedInAttempt2:0
          });
        }
      }
    }

    // Lưu tiến độ ngay khi từ này đã qua hết các bước mà không bị đưa vào vòng lặp lại

        queue:nextFailedList,

        nextRoundFailed:[],
        res:newRes,

const YTL=(()=>{
  const TS=/^\s*[\[(]?(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?[\])]?\s*(?:[-–—:]\s*)?(.*)$/;
  const CUE=/(?:(\d+):)?(\d{1,2}):(\d{2})[.,](\d{1,3})/g;
  const sec=(h,m,s,ms)=>(+h||0)*3600+(+m||0)*60+(+s||0)+(ms?+("0."+ms):0);
  const STOP=new Set("は が を に へ と で も の や か ね よ わ ぞ ぜ な さ て た だ です ます ました でした ません ましょう から まで より など ので のに けど けれど でも そして しかし ない ある いる する した して これ それ あれ この その あの ここ そこ こと もの ため よう という いう って ちょっと とても もう まだ また 私 僕 俺 彼 彼女 あなた".split(" "));
  const RB=/([\u4E00-\u9FFF\u3005\u3006\u30F6]+)[《（(]([\u3041-\u3096\u30A1-\u30FA\u30FC]+)[》）)]/g;

  const id=u=>{
    u=String(u||"").trim();if(/^[\w-]{11}$/.test(u))return u;let m=null;
    try{
      const x=new URL(/^https?:/i.test(u)?u:"https://"+u),h=x.hostname.replace(/^www\.|^m\./,"");
      if(h==="youtu.be")m=x.pathname.slice(1).split("/")[0];
      else if(/(^|\.)youtube(-nocookie)?\.com$/.test(h)){
        if(x.pathname==="/watch")m=x.searchParams.get("v");
        else{const p=x.pathname.split("/").filter(Boolean);if(["shorts","embed","live","v"].includes(p[0]))m=p[1]}
      }
    }catch(e){}
    return m&&/^[\w-]{11}$/.test(m)?m:null;
  };
  const rb=s=>{
    const segs=[];let last=0,m,has=false;RB.lastIndex=0;
    while((m=RB.exec(s))){if(m.index>last)segs.push([s.slice(last,m.index),null]);segs.push([m[1],m[2]]);last=m.index+m[0].length;has=true}
    if(last<s.length)segs.push([s.slice(last),null]);
    return{plain:segs.map(x=>x[0]).join(""),segs:has?segs:null};
  };
  const mkLine=(raw,t,e,viOverride)=>{
    let jp=raw,vi=viOverride||"";
    if(!vi){
      const p=raw.split(/\s*[|｜\t]\s*/);
      if(p.length>1){jp=p[0];vi=p.slice(1).join(" ").trim()}
    }
    const r=rb(jp.trim());if(!r.plain)return null;
    const o={t:t==null?null:t,text:r.plain};
    if(e!=null)o.e=e;if(vi)o.vi=vi;if(r.segs)o.rb=r.segs;
    o.tokens=buildTokens(jp.trim(),r.plain,r.segs);
    return o;
  };
  const tok=s=>{
    if(typeof Intl!=="undefined"&&Intl.Segmenter){
      return[...new Intl.Segmenter("ja",{granularity:"word"}).segment(s)].map(x=>({s:x.segment,w:!!x.isWordLike}));
    }
    return(s.match(/[\u4E00-\u9FFF\u3005]+[\u3041-\u3096]{0,2}|[\u30A1-\u30FA\u30FC]+|[\u3041-\u3096]+|[A-Za-z0-9]+|[\s\S]/g)||[])
      .map(x=>({s:x,w:/[\u3041-\u9FFF\uFF66-\uFF9F\w]/.test(x)}));
  };
  /* Tách câu thành mảng token { text, furigana, meaning, isWord } hỗ trợ <ruby>/<rt> */
  const buildTokens=(rawJp,plain,segs)=>{
    const furiMap=new Map();
    if(segs){
      segs.forEach(([txt,f])=>{if(f)furiMap.set(txt,f)});
    }
    const parts=tok(plain);
    return parts.map(p=>{
      const s=p.s;
      let furigana="";
      if(furiMap.has(s)){
        furigana=furiMap.get(s);
      }else{
        for(const[k,v] of furiMap.entries()){
          if(s.includes(k)&&k.length>=1){
            furigana=v;
            break;
          }
        }
      }
      return{text:s,furigana,meaning:"",isWord:p.w&&!/^[\s\u3000、。，．,.!?！？「」『』（）()…・~〜"'“”‘’]+$/.test(s)};
    });
  };
  /* Phân tích từ 2 khung song song (Scripts JP & Bản dịch VI) hoặc 1 khung kết hợp */
  const parseParallel=(rawJp,rawVi)=>{
    const jpLines=parse(rawJp);
    if(!rawVi||!String(rawVi).trim())return jpLines;
    const viRawLines=String(rawVi).replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
    const viClean=viRawLines.map(ln=>{
      const m=TS.exec(ln);
      return m&&m[5].trim()?m[5].trim():ln;
    });
    return jpLines.map((item,idx)=>({
      ...item,
      vi:item.vi||viClean[idx]||""
    }));
  };
  const parse=raw=>{
    raw=String(raw||"").replace(/\r/g,"").replace(/^\uFEFF/,"");const out=[];
    if(/-->/.test(raw)){
      for(const b of raw.split(/\n{2,}/)){
        const ls=b.split("\n"),k=ls.findIndex(l=>l.includes("-->"));if(k<0)continue;
        const tm=[...ls[k].matchAll(CUE)];if(tm.length<2)continue;
        const t=sec(...tm[0].slice(1)),e=sec(...tm[1].slice(1));
        const txt=ls.slice(k+1).join("").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").trim();if(!txt)continue;
        const prev=out[out.length-1];
        if(prev&&prev.text===txt){prev.e=e;continue}
        const o=mkLine(txt,t,e);if(o)out.push(o);
      }
    }else{
      const L=raw.split("\n").map(x=>x.trim()).filter(Boolean),tm=L.map(x=>TS.exec(x));
      const mc=tm.filter(Boolean),only=mc.filter(x=>!x[5].trim()).length,timed=mc.length>=2&&(mc.length>=L.length*.6||(only>=mc.length*.8&&mc.length>=L.length*.4));
      let pend=null;
      L.forEach((ln,i)=>{
        let t=null,txt=ln;
        if(timed){
          if(tm[i]){t=sec(tm[i][1],tm[i][2],tm[i][3],tm[i][4]);txt=tm[i][5].trim();if(!txt){pend=t;return}}
          else if(pend!=null){t=pend;pend=null}
        }
        if(timed){const o=mkLine(txt,t);if(o)out.push(o);return}
        if(/[|｜\t]/.test(txt)){const o=mkLine(txt,null);if(o)out.push(o);return}
        (txt.match(/[^。！？!?]+[。！？!?]*/g)||[]).forEach(s=>{const o=mkLine(s.trim(),null);if(o)out.push(o)});
      });
    }
    return out.slice(0,400);
  };
  const mk=(text,n)=>{
    const tk=tok(text),c=[];
    tk.forEach((x,i)=>{
      if(!x.w)return;const s=x.s;if(STOP.has(s)||/^[0-9０-９]+$/.test(s))return;
      const kj=/[\u4E00-\u9FFF]/.test(s),kt=/[\u30A1-\u30FA]/.test(s),hr=/^[\u3041-\u3096ー]+$/.test(s);
      if(!(kj||kt||(hr&&s.length>=3)))return;
      c.push({i,sc:(kj?3:kt?2:1)+Math.min(s.length,4)*.3+Math.random()*1.5});
    });
    c.sort((x,y)=>y.sc-x.sc);const pick=[];
    for(const x of c){if(pick.length>=n)break;if(pick.some(p=>Math.abs(p.i-x.i)<2))continue;pick.push(x)}
    pick.sort((x,y)=>x.i-y.i);
    return pick.length?{tk,idx:pick.map(p=>p.i)}:null;
  };
  const nz=s=>String(s||"").normalize("NFKC").replace(/[\s\u3000、。，．,.!?！？「」『』（）()…・~〜"'“”‘’]/g,"");
  const hira=s=>s.replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const checkFill=(ans,target,reading)=>{
    const a=nz(ans),t=nz(target);if(!a)return{ok:false};
    if(a===t)return{ok:true};
    if(hira(a)===hira(t))return{ok:true,note:"đúng (khác bảng chữ)"};
    if(reading&&hira(a)===hira(nz(reading)))return{ok:true,note:"đúng cách đọc"};
    return{ok:false};
  };
  const reading=l=>l.rb?l.rb.map(x=>x[1]||x[0]).join(""):null;
  const diff=(u,t)=>{
    const a=Array.from(nz(u)),b=Array.from(nz(t)),n=a.length,m=b.length;
    const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
    const U=[],T=[];let i=0,j=0;
    while(i<n&&j<m){
      if(a[i]===b[j]){U.push({c:a[i],k:"eq"});T.push({c:b[j],k:"eq"});i++;j++}
      else if(L[i+1][j]>=L[i][j+1]){U.push({c:a[i],k:"x"});i++}
      else{T.push({c:b[j],k:"miss"});j++}
    }
    while(i<n)U.push({c:a[i++],k:"x"});while(j<m)T.push({c:b[j++],k:"miss"});
    return{U,T,sim:Math.max(n,m)?L[0][0]/Math.max(n,m):1};
  };
  const checkDict=(user,line)=>{
    const u=nz(user),t=nz(line.text),r=reading(line),d=diff(user,line.text);
    if(!u)return{ok:false,d};
    if(u===t)return{ok:true,d};
    if(hira(u)===hira(t))return{ok:true,d,note:"đúng (khác bảng chữ)"};
    if(r&&hira(u)===hira(nz(r)))return{ok:true,d,note:"đúng cách đọc (chưa viết kanji)"};
    return{ok:false,d};
  };
  const endOf=(ls,i)=>{
    const a=ls[i];if(a.t==null)return null;if(a.e!=null&&a.e>a.t)return a.e+.25;
    for(let j=i+1;j<ls.length;j++)if(ls[j].t!=null&&ls[j].t>a.t)return ls[j].t;
    return a.t+Math.max(3,a.text.length*.4);
  };
  const fmt=t=>t==null?"--:--":String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0");
  return{id,parse,parseParallel,buildTokens,tok,mk,nz,hira,checkFill,checkDict,diff,endOf,reading,fmt,rb};
})();

/* Component hiển thị câu tiếng Nhật tách token tương tác + Furigana <ruby>/<rt> + Đồng bộ Theme (Chỉ nổi bật cả dòng khi video phát tới) */
function InteractiveSentenceCard({
  tokens=[],
  translation="",
  showJp=true,
  showVi=true,
  showFuri=true,
  selectedWord="",
  onSelectToken,
  onSpeakWord,
  isActive=false,
  theme={bg:"#FFFDF8",sidebar:"#F8DDE8",accent:"#E88BAE",accentSoft:"#FCECF3",card:"#FFFFFF",border:"#F3C6D8",text:"#5A4E63",dark:false}
}){
  const E=React.createElement;
  const[hoveredIdx,setHoveredIdx]=useState(-1);

  const boxBg=isActive?theme.sidebar:theme.accentSoft;
  const furiColor=theme.accent;

  const renderRubyToken=tk=>{
    const text=tk.text||"";
    const furi=tk.furigana||"";
    const rtStyle={
      fontSize:"0.58em",
      color:furiColor,
      fontWeight:800,
      letterSpacing:"0.02em"
    };
    if(!showFuri||!furi)return text;
    const m=text.match(/^([\u4E00-\u9FFF\u3005\u3006\u30F6]+)(.*)$/);
    if(m){
      const kanjiPart=m[1],okuri=m[2];

        kanjiFuri=furi.slice(0,furi.length-okuri.length);
      }
      return E(React.Fragment,null,
        E("ruby",{style:{rubyAlign:"center"}},kanjiPart,E("rt",{style:rtStyle},kanjiFuri)),
        okuri
      );
    }
    return E("ruby",{style:{rubyAlign:"center"}},text,E("rt",{style:rtStyle},furi));
  };

  return E("div",{style:{display:"grid",gap:6,width:"100%"}},
    showJp&&E("div",{
      style:{
        backgroundColor:boxBg,
        borderRadius:14,
        padding:"10px 14px",
        color:theme.text,
        display:"flex",
        flexWrap:"wrap",
        alignItems:"flex-end",
        gap:"5px 7px",

        transition:"background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease"

      const isSelected=interactive&&selectedWord&&selectedWord===tk.text;

        return E("span",{key:idx,style:{color:theme.text,opacity:.7,fontSize:16,paddingBottom:2}},tk.text);
      }
      return E("span",{
        key:idx,
        role:"button",
        tabIndex:0,
        title:tk.meaning?`${tk.text}${tk.furigana?" ("+tk.furigana+")":""}: ${tk.meaning} — Bấm để chọn / lưu từ`:"Bấm để tra nghĩa, nghe phát âm hoặc lưu vào sổ",
        onMouseEnter:()=>setHoveredIdx(idx),
        onMouseLeave:()=>setHoveredIdx(-1),
        onClick:e=>{
          e.stopPropagation();
          onSpeakWord&&onSpeakWord(tk.text);
          onSelectToken&&onSelectToken(tk);
        },
        style:{
          display:"inline-flex",
          flexDirection:"column",

          justifyContent:"flex-end",
          padding:"1px 6px 2px",
          borderRadius:9,
          fontSize:17,
          fontWeight:800,
          color:theme.text,
          cursor:"pointer",
          userSelect:"none",
          transition:"background-color 0.14s ease, box-shadow 0.14s ease",
          borderBottom:`2px solid ${theme.accent}`,
          backgroundColor:(isSelected||isHovered)
            ?(theme.dark?"rgba(255,255,255,0.16)":"rgba(255,255,255,0.9)")
            :"transparent",
          boxShadow:isSelected?`0 0 0 1.5px ${theme.accent}`:"none"
        }
      },renderRubyToken(tk));
    })),
    showVi&&translation&&E("div",{
      style:{
        backgroundColor:isActive?theme.accentSoft:theme.card,
        border:`1.5px solid ${isActive?theme.accent:theme.border}`,
        borderRadius:12,
        padding:"8px 12px",
        color:theme.text,
        fontWeight:800,
        fontSize:14,
        lineHeight:1.5,
        transition:"background-color 0.2s ease, border-color 0.2s ease"
      }
    },translation)
  );
}

const SUBJECT_COLORS=["#F8DDE8","#DCEBFA","#E8DDF8","#FFF0C9","#F4EBDD","#DDF5E6"];
function SubjectPicker({subjects,notebooks,profile,theme:n,onPick,onSave,onLogout,onHonor}){
  const C=React.createElement;
  const[form,setForm]=useState(null);
  const[err,setErr]=useState("");
  const cnt=id=>notebooks.filter(x=>x.subject===id).length;
  const submit=e=>{
    e.preventDefault();
    const label=form.label.trim();
    if(!label){setErr("Vui lòng nhập tên môn học.");return}
    if(form.id){onSave(subjects.map(x=>x.id===form.id?{...x,label,icon:form.icon||x.icon,color:form.color}:x))}
    else{onSave([...subjects,{id:"s-"+Date.now(),label,icon:form.icon||"📘",color:form.color}])}
    setForm(null);setErr("");
  };
  const del=x=>{
    if(subjects.length<=1){setErr("Cần giữ lại ít nhất một môn học.");return}
    const k=cnt(x.id);
    if(k>0){setErr(`Môn "${x.label}" còn ${k} sổ tay. Hãy xóa sổ tay trước khi xóa môn.`);return}
    if(!window.confirm(`Xóa môn "${x.label}"?`))return;
    setErr("");onSave(subjects.filter(y=>y.id!==x.id));
